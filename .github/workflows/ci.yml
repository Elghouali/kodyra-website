name: KODYRA Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Verify build assets
        run: |
          test -f dist/index.html
          test -f dist/src/main.js
          test -f dist/styles/main.css
      - name: Package deployable website
        uses: actions/upload-artifact@v4
        with:
          name: kodyra-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
