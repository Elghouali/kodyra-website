name: Publish KODYRA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kodyra-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate, test, and build website
        run: |
          npm run check
          npm test
          npm run build

      - name: Check deployable assets
        run: |
          test -f dist/index.html
          test -f dist/src/main.js
          test -f dist/styles/main.css

      - name: Publish only built assets to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STAGED_SITE="$(mktemp -d)"
          cp -a dist/. "$STAGED_SITE/"
          touch "$STAGED_SITE/.nojekyll"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git switch -C gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$STAGED_SITE"/. .

          git add -A
          if git diff --cached --quiet; then
            echo "No changes in generated site."
          else
            git commit -m "deploy: publish KODYRA site from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
